<section aria-labelledby="panel-title">
  <h2 id="panel-title" class="section-title">Indicadores activos</h2>
  @for (card of store.cards(); track card.meta.id) {
    <app-card
      [card]="card"
      (opened)="store.openCard(card.meta.id)"
      (regionPicked)="store.select($event)"
      (breakdownChosen)="store.setBreakdown(card.meta.id, $event)"
    />
  } @empty {
    <p class="empty">Activa indicadores en el catálogo para ver sus gráficos.</p>
  }
</section>
